<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>MenuSwift - Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b,#334155);color:#0f172a}.card{width:min(440px,100%);background:#fff;border-radius:24px;padding:36px 28px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}img{width:150px;max-width:60%;border-radius:18px}h1{margin:22px 0 8px;font-size:26px}p{margin:0 0 24px;color:#64748b;line-height:1.6}button{border:0;border-radius:12px;background:#2563eb;color:#fff;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer}
  </style>

    <!-- MenuSwift PWA -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f172a">
    <meta name="application-name" content="MenuSwift">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MenuSwift">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="MenuSwift">
    <h1>You’re offline</h1>
    <p>MenuSwift needs an internet connection for login, orders and live restaurant data. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>

    <script>
      // Register the MenuSwift service worker without changing existing app logic.
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .catch((error) => console.warn('MenuSwift PWA service worker registration failed:', error));
        });
      }
    </script>

</body>
</html>
